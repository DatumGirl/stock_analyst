[project]
name = "stockintel-graph"
version = "0.1.0"
description = "Relationship intelligence over Memgraph for the StockIntel platform"
requires-python = ">=3.12"
dependencies = [
    "gqlalchemy>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_service"]

[tool.hatch.build.targets.wheel.force-include]
"queries" = "graph_service/queries"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["graph_service"]

[[tool.mypy.overrides]]
module = "gqlalchemy.*"
ignore_missing_imports = true
